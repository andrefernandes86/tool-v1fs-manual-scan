# Build, optionally scan with Trend Vision One (TMAS), publish to Docker Hub,
# and post a formatted report on the GitHub Actions summary.
# Nothing blocks the pipeline: TMAS failures are reported but do not fail the job.

name: Build, Scan & Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: v1fs-scanner

jobs:
  build-scan-publish:
    name: Build · Scan · Publish · Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trend Vision One (TMAS) scan
        id: tmas-scan
        if: vars.TMAS_SCAN_ENABLED == 'true'
        continue-on-error: true
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "true"
          malwareScan: "true"
          secretsScan: "true"
          additionalArgs: "--saveSBOM"
          # Scans repo source; non-blocking so pipeline always continues

      - name: Upload Trend Vision One (TMAS) scan report
        if: always() && vars.TMAS_SCAN_ENABLED == 'true' && steps.tmas-scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tmas-scan-report
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        id: docker-login
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push to Docker Hub
        id: push
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:build "$REPO:latest"
          docker tag ${{ env.IMAGE_NAME }}:build "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"
          docker push "$REPO:${{ github.sha }}"
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Pipeline report
        id: report
        if: always()
        run: |
          BUILD_OUTCOME="${{ steps.build.outcome }}"
          TMAS_OUTCOME="${{ steps.tmas-scan.outcome }}"
          LOGIN_OUTCOME="${{ steps.docker-login.outcome }}"
          PUSH_OUTCOME="${{ steps.push.outcome }}"

          status_icon() {
            case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac
          }
          status_text() {
            case "$1" in success) echo "**Success**";; failure) echo "**Failed**";; skipped) echo "**Skipped**";; *) echo "**$1**";; esac
          }

          # Use push step output for repo (avoids exposing secret in summary)
          PUSH_REPO="${{ steps.push.outputs.repo }}"
          GIT_SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "# 📋 V1 File Security Scanner — Pipeline Report"
            echo ""
            echo "## Build & steps"
            echo ""
            echo "| Step | Status | Details |"
            echo "|------|--------|--------|"
          } >> $GITHUB_STEP_SUMMARY

          echo "| **Build** | $(status_icon "$BUILD_OUTCOME") $(status_text "$BUILD_OUTCOME") | Docker image built |" >> $GITHUB_STEP_SUMMARY
          if [ "$TMAS_OUTCOME" = "skipped" ]; then
            echo "| **Trend Vision One (TMAS)** | ⏭️ **Skipped** | Set \`TMAS_SCAN_ENABLED=true\` + \`TMAS_API_KEY\` to enable |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Trend Vision One (TMAS)** | $(status_icon "$TMAS_OUTCOME") $(status_text "$TMAS_OUTCOME") | Vulnerability, malware, secrets + SBOM |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$LOGIN_OUTCOME" = "skipped" ]; then
            echo "| **Docker Hub login** | ⏭️ **Skipped** | Set \`PUBLISH_TO_DOCKERHUB=true\` to enable |" >> $GITHUB_STEP_SUMMARY
            echo "| **Publish to Docker Hub** | ⏭️ **Skipped** | — |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Docker Hub login** | $(status_icon "$LOGIN_OUTCOME") $(status_text "$LOGIN_OUTCOME") | Logged in |" >> $GITHUB_STEP_SUMMARY
            echo "| **Publish to Docker Hub** | $(status_icon "$PUSH_OUTCOME") $(status_text "$PUSH_OUTCOME") | Image pushed |" >> $GITHUB_STEP_SUMMARY
          fi

          {
            echo ""
            echo "---"
            echo "## 📦 Docker Hub"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ -n "$PUSH_REPO" ] && [ "$PUSH_OUTCOME" = "success" ]; then
            {
              echo "✅ **Image published to Docker Hub**"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **Repository** | [\`$PUSH_REPO\`](https://hub.docker.com/r/$PUSH_REPO/tags) |"
              echo "| **Tags** | \`latest\`, \`$GIT_SHA\` |"
              echo "| **Pull** | \`docker pull $PUSH_REPO:latest\` |"
              echo ""
              echo "[**Open on Docker Hub →**](https://hub.docker.com/r/$PUSH_REPO/tags)"
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "❌ **Image was not pushed to Docker Hub**"
              echo ""
              echo "To publish: set repository variable \`PUBLISH_TO_DOCKERHUB\` = \`true\` and secrets \`DOCKERHUB_USERNAME\`, \`DOCKERHUB_TOKEN\` (see \`.github/SECRETS.md\`)."
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          fi

          {
            echo "---"
            echo "## 🔒 Trend Vision One (TMAS)"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ "$TMAS_OUTCOME" = "skipped" ]; then
            {
              echo "⏭️ **TMAS scan was not run**"
              echo ""
              echo "To enable: set repository variable \`TMAS_SCAN_ENABLED\` = \`true\` and secret \`TMAS_API_KEY\` (Vision One API key with \"Run artifact scan\")."
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          elif [ "$TMAS_OUTCOME" = "success" ]; then
            {
              echo "✅ **TMAS scan completed** (vulnerabilities, malware, secrets + SBOM)"
              echo ""
              echo "📥 Download the **tmas-scan-report** artifact at the bottom of this run (Markdown + JSON)."
              echo ""
              echo "[Open this run →]($RUN_URL)"
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "⚠️ **TMAS scan ran but reported findings or errors** (pipeline is non-blocking)"
              echo ""
              echo "Check the **Trend Vision One (TMAS) scan** step log above. If the action produced a report, download **\`tmas-scan-report\`** from the Artifacts section below."
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          fi

          {
            echo "---"
            echo "*Configure variables and secrets in **Settings → Secrets and variables → Actions** (see \`.github/SECRETS.md\`).*"
          } >> $GITHUB_STEP_SUMMARY
