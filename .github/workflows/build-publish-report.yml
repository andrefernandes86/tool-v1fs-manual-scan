# Linear pipeline: build → push → vulnerabilities-scan → malware-scan → secrets-scan → sbom-scan → report
# Simple timeline; report aggregates all findings with full details.

name: Build, Scan & Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: v1fs-scanner

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image
        run: docker save ${{ env.IMAGE_NAME }}:latest -o image.tar
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  push-to-dockerhub:
    name: push-to-dockerhub
    needs: build
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.outputs.outputs.repo }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      - name: Log in to Docker Hub
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push
        id: push
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        run: |
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$REPO:latest"
          docker push "$REPO:latest" || true
          echo "repo=$REPO" >> $GITHUB_OUTPUT
      - name: Set job output
        id: outputs
        if: always()
        run: echo "repo=${{ steps.push.outputs.repo }}" >> $GITHUB_OUTPUT

  vulnerabilities-scan:
    name: vulnerabilities-scan
    needs: push-to-dockerhub
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS vulnerability scan
        id: scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "true"
          malwareScan: "false"
          secretsScan: "false"
          additionalArgs: ""
      - name: Analyze vulnerabilities and create summary
        if: always()
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "## 🔍 Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f tmas_scan_report.json ]; then
            echo "⚠️ No scan output (scan failed or no results file). Check the **TMAS vulnerability scan** step log." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### Overview" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(jq -r '.vulnerabilities.criticalCount // .vulnerability.criticalCount // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          HIGH=$(jq -r '.vulnerabilities.highCount // .vulnerability.highCount // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq -r '.vulnerabilities.mediumCount // .vulnerability.mediumCount // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          LOW=$(jq -r '.vulnerabilities.lowCount // .vulnerability.lowCount // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" != "null" ] && [ "$CRITICAL" -gt 0 ] 2>/dev/null; then
            echo "### ❌ Critical Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '
              (.vulnerabilities.findings.Critical // .vulnerability.findings.Critical // [])[] |
              "- " + (.id // "Unknown") + " (" + (.name // .packageName // "unknown") + ")" +
              (if .fix and .fix != "unknown" and .fix != "not-fixed" then " - Fix: " + .fix else "" end)
            ' tmas_scan_report.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "See artifact for details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No Critical Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$HIGH" != "null" ] && [ "$HIGH" -gt 0 ] 2>/dev/null; then
            echo "### ⚠️ High Severity" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '(.vulnerabilities.findings.High // .vulnerability.findings.High // [])[] | "- " + (.id // "Unknown") + " (" + (.name // .packageName // "unknown") + ")"' tmas_scan_report.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "See artifact" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  secrets-scan:
    name: secrets-scan
    needs: malware-scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS secrets scan
        id: scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "false"
          malwareScan: "false"
          secretsScan: "true"
          additionalArgs: ""
      - name: Analyze secrets and create summary
        if: always()
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "## 🔒 Secrets Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f tmas_scan_report.json ]; then
            echo "⚠️ No scan output (scan failed or no results file). Check the **TMAS secrets scan** step log." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### Overview" >> $GITHUB_STEP_SUMMARY
          COUNT=$(jq -r '.secrets.unmitigatedFindingsCount // .secrets.findingsCount // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unmitigated secrets | $COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | $([ "$COUNT" = "0" ] 2>/dev/null && echo "✅ Clean" || echo "❌ Secrets found") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" != "null" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "### ❌ Secret details" >> $GITHUB_STEP_SUMMARY
            echo "| Rule ID | Location |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.secrets.findings.unmitigated[]? | "| \(.ruleID // .ruleId // "—") | \(.location.path // .path // "—") |"' tmas_scan_report.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "| — | See artifact |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No secrets found" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  sbom-scan:
    name: sbom-scan
    needs: secrets-scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS SBOM scan
        id: scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "true"
          malwareScan: "false"
          secretsScan: "false"
          additionalArgs: "--saveSBOM"
      - name: Analyze SBOM and create summary
        if: always()
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "## 📋 SBOM Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f tmas_scan_report.json ]; then
            echo "⚠️ No scan output (scan failed or no results file). Check the **TMAS SBOM scan** step log." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          COMPONENTS=$(jq -r '.sbom.components | length // .components | length // "—"' tmas_scan_report.json 2>/dev/null || echo "—")
          echo "| SBOM status | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Components (if available) | $COMPONENTS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the **sbom-scan-results** artifact for the full SBOM (JSON) and scan report." >> $GITHUB_STEP_SUMMARY
          if ls SBOM_*.json 1>/dev/null 2>&1; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "SBOM file(s): \`SBOM_*.json\` (in artifact)" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
            SBOM_*.json
          if-no-files-found: ignore

  malware-scan:
    name: malware-scan
    needs: vulnerabilities-scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      - name: TMAS malware scan
        id: scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "docker:${{ env.IMAGE_NAME }}:latest"
          vulnerabilitiesScan: "false"
          malwareScan: "true"
          secretsScan: "false"
          additionalArgs: ""
      - name: Analyze malware and create summary
        if: always()
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "## 🛡️ Malware Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f tmas_scan_report.json ]; then
            echo "⚠️ No scan output (scan failed or no results file). Check the **TMAS malware scan** step log." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### Overview" >> $GITHUB_STEP_SUMMARY
          COUNT=$(jq -r '.malware.count // .malwareScan.findingsCount // .malwareScan.count // .malware.findings | length // 0' tmas_scan_report.json 2>/dev/null || echo "0")
          COUNT=${COUNT:-0}
          if [ "$COUNT" = "null" ]; then COUNT=0; fi
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Malware detected | $COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | $([ "$COUNT" = "0" ] 2>/dev/null && echo "✅ Clean" || echo "❌ Malware found") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" != "null" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "### ❌ Malware details" >> $GITHUB_STEP_SUMMARY
            echo "See the **malware-scan-results** artifact for full report (tmas_scan_report.json)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '(.malware.findings // .malwareScan.findings // [])[]? | "- " + (.name // .malwareName // .path // "—")' tmas_scan_report.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          else
            echo "### ✅ No malware detected" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malware-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  report:
    name: report
    needs: [build, push-to-dockerhub, vulnerabilities-scan, secrets-scan, sbom-scan, malware-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-scan-results'
          path: scan-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Generate full report
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          mkdir -p scan-artifacts
          SUM="$GITHUB_STEP_SUMMARY"
          status_icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac; }

          BUILD_RESULT="${{ needs.build.result }}"
          PUSH_RESULT="${{ needs.push-to-dockerhub.result }}"
          VULN_RESULT="${{ needs.vulnerabilities-scan.result }}"
          SECRETS_RESULT="${{ needs.secrets-scan.result }}"
          SBOM_RESULT="${{ needs.sbom-scan.result }}"
          MALWARE_RESULT="${{ needs.malware-scan.result }}"
          PUSH_REPO="${{ needs.push-to-dockerhub.outputs.repo }}"

          {
            echo "# 📋 Pipeline Report"
            echo ""
            echo "**build-publish-report.yml** · Linear pipeline: build → push → vuln → malware → secrets → sbom → report"
            echo ""
            echo "## Timeline"
            echo ""
            echo "| build | push | vulnerabilities | malware | secrets | sbom | report |"
            echo "| $(status_icon "$BUILD_RESULT") | $(status_icon "$PUSH_RESULT") | $(status_icon "$VULN_RESULT") | $(status_icon "$MALWARE_RESULT") | $(status_icon "$SECRETS_RESULT") | $(status_icon "$SBOM_RESULT") | ✅ |"
            echo ""
            echo "---"
            echo "## 📦 Docker Hub"
            echo ""
          } >> "$SUM"
          if [ -n "$PUSH_REPO" ] && [ "$PUSH_RESULT" = "success" ]; then
            { echo "✅ **Image published** · [\`$PUSH_REPO\`](https://hub.docker.com/r/$PUSH_REPO/tags)"; echo ""; echo "\`docker pull $PUSH_REPO:latest\`"; echo ""; } >> "$SUM"
          else
            { echo "⏭️ **Not published** · Set variable \`PUBLISH_TO_DOCKERHUB=true\` and variable \`DOCKERHUB_USERNAME\` + secret \`DOCKERHUB_TOKEN\`."; echo ""; } >> "$SUM"
          fi

          # Helper: append vulnerability table from JSON (path as $1)
          append_vuln_details() {
            local f="$1"
            [ ! -f "$f" ] && return
            echo "### 🔍 Vulnerabilities (full list)" >> "$SUM"
            echo "" >> "$SUM"
            CRITICAL=$(jq -r '.vulnerabilities.criticalCount // .vulnerability.criticalCount // 0' "$f" 2>/dev/null || echo "0")
            HIGH=$(jq -r '.vulnerabilities.highCount // .vulnerability.highCount // 0' "$f" 2>/dev/null || echo "0")
            MEDIUM=$(jq -r '.vulnerabilities.mediumCount // .vulnerability.mediumCount // 0' "$f" 2>/dev/null || echo "0")
            LOW=$(jq -r '.vulnerabilities.lowCount // .vulnerability.lowCount // 0' "$f" 2>/dev/null || echo "0")
            echo "| Severity | Count |" >> "$SUM"
            echo "|----------|-------|" >> "$SUM"
            echo "| Critical | $CRITICAL |" >> "$SUM"
            echo "| High | $HIGH |" >> "$SUM"
            echo "| Medium | $MEDIUM |" >> "$SUM"
            echo "| Low | $LOW |" >> "$SUM"
            echo "" >> "$SUM"
            echo "#### Findings by severity" >> "$SUM"
            for sev in Critical High Medium Low; do
              COUNT=$(jq -r "(.vulnerabilities.findings.${sev} // .vulnerability.findings.${sev} // []) | length" "$f" 2>/dev/null || echo "0")
              [ "$COUNT" = "null" ] && COUNT=0
              if [ "$COUNT" -gt 0 ] 2>/dev/null; then
                echo "**${sev}**" >> "$SUM"
                echo "" >> "$SUM"
                echo "| ID | Package / Name | Fix / Version |" >> "$SUM"
                echo "|----|----------------|---------------|" >> "$SUM"
                jq -r --arg s "$sev" '
                  (.vulnerabilities.findings[$s] // .vulnerability.findings[$s] // [])[] |
                  [.id // "—", .name // .packageName // "—", .fix // .fixedVersion // "—"] | @tsv
                ' "$f" 2>/dev/null | while IFS=$'\t' read -r id pkg fix; do
                  echo "| $id | $pkg | $fix |" >> "$SUM"
                done
                echo "" >> "$SUM"
              fi
            done
            echo "---" >> "$SUM"
          }

          # Helper: append malware details
          append_malware_details() {
            local f="$1"
            [ ! -f "$f" ] && return
            echo "### 🛡️ Malware scan (full list)" >> "$SUM"
            echo "" >> "$SUM"
            COUNT=$(jq -r '.malware.count // .malwareScan.findingsCount // (.malware.findings | length) // 0' "$f" 2>/dev/null || echo "0")
            [ "$COUNT" = "null" ] && COUNT=0
            echo "| Metric | Value |" >> "$SUM"
            echo "|--------|-------|" >> "$SUM"
            echo "| Malware detected | $COUNT |" >> "$SUM"
            echo "" >> "$SUM"
            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              echo "| Name / Type | Path / Location |" >> "$SUM"
              echo "|-------------|-----------------|" >> "$SUM"
              jq -r '(.malware.findings // .malwareScan.findings // [])[]? | [.name // .malwareName // .type // "—", .path // .location // .filePath // "—"] | @tsv' "$f" 2>/dev/null | while IFS=$'\t' read -r name path; do
                echo "| $name | $path |" >> "$SUM"
              done
            else
              echo "✅ No malware detected." >> "$SUM"
            fi
            echo "" >> "$SUM"
            echo "---" >> "$SUM"
          }

          # Helper: append secrets details
          append_secrets_details() {
            local f="$1"
            [ ! -f "$f" ] && return
            echo "### 🔒 Secrets scan (full list)" >> "$SUM"
            echo "" >> "$SUM"
            COUNT=$(jq -r '.secrets.unmitigatedFindingsCount // .secrets.findingsCount // 0' "$f" 2>/dev/null || echo "0")
            [ "$COUNT" = "null" ] && COUNT=0
            echo "| Metric | Value |" >> "$SUM"
            echo "|--------|-------|" >> "$SUM"
            echo "| Unmitigated secrets | $COUNT |" >> "$SUM"
            echo "" >> "$SUM"
            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              echo "| Rule ID | Location / Path |" >> "$SUM"
              echo "|----------|-----------------|" >> "$SUM"
              jq -r '.secrets.findings.unmitigated[]? // .secrets.findings[]? | [.ruleID // .ruleId // "—", .location.path // .path // "—"] | @tsv' "$f" 2>/dev/null | while IFS=$'\t' read -r rule path; do
                echo "| $rule | $path |" >> "$SUM"
              done
            else
              echo "✅ No secrets found." >> "$SUM"
            fi
            echo "" >> "$SUM"
            echo "---" >> "$SUM"
          }

          # Helper: append SBOM summary
          append_sbom_details() {
            local f="$1"
            [ ! -f "$f" ] && return
            echo "### 📋 SBOM scan" >> "$SUM"
            echo "" >> "$SUM"
            COMP=$(jq -r '.sbom.components | length // .components | length // 0' "$f" 2>/dev/null || echo "0")
            [ "$COMP" = "null" ] && COMP="—"
            echo "| Metric | Value |" >> "$SUM"
            echo "|--------|-------|" >> "$SUM"
            echo "| Components | $COMP |" >> "$SUM"
            echo "" >> "$SUM"
            echo "📥 Download the **sbom-scan-results** artifact for the full SBOM JSON." >> "$SUM"
            echo "" >> "$SUM"
            echo "---" >> "$SUM"
          }

          echo "## 🔒 Trend Vision One (TMAS) – detailed findings" >> "$SUM"
          echo "" >> "$SUM"

          VULN_JSON=""
          for d in scan-artifacts/vulnerability-scan-results scan-artifacts/vulnerability-scan-results-*; do
            [ -f "$d/tmas_scan_report.json" ] && VULN_JSON="$d/tmas_scan_report.json" && break
          done
          [ -z "$VULN_JSON" ] && [ -f scan-artifacts/vulnerability-scan-results/tmas_scan_report.json ] && VULN_JSON="scan-artifacts/vulnerability-scan-results/tmas_scan_report.json"
          if [ -n "$VULN_JSON" ]; then append_vuln_details "$VULN_JSON"; else echo "⚠️ No vulnerability scan data (job failed or no artifact)." >> "$SUM"; echo "" >> "$SUM"; fi

          MAL_JSON=""
          for d in scan-artifacts/malware-scan-results scan-artifacts/malware-scan-results-*; do
            [ -f "$d/tmas_scan_report.json" ] && MAL_JSON="$d/tmas_scan_report.json" && break
          done
          [ -z "$MAL_JSON" ] && [ -f scan-artifacts/malware-scan-results/tmas_scan_report.json ] && MAL_JSON="scan-artifacts/malware-scan-results/tmas_scan_report.json"
          if [ -n "$MAL_JSON" ]; then append_malware_details "$MAL_JSON"; else echo "⚠️ No malware scan data (job failed or no artifact)." >> "$SUM"; echo "" >> "$SUM"; fi

          SEC_JSON=""
          for d in scan-artifacts/secrets-scan-results scan-artifacts/secrets-scan-results-*; do
            [ -f "$d/tmas_scan_report.json" ] && SEC_JSON="$d/tmas_scan_report.json" && break
          done
          [ -z "$SEC_JSON" ] && [ -f scan-artifacts/secrets-scan-results/tmas_scan_report.json ] && SEC_JSON="scan-artifacts/secrets-scan-results/tmas_scan_report.json"
          if [ -n "$SEC_JSON" ]; then append_secrets_details "$SEC_JSON"; else echo "⚠️ No secrets scan data (job failed or no artifact)." >> "$SUM"; echo "" >> "$SUM"; fi

          SBOM_JSON=""
          for d in scan-artifacts/sbom-scan-results scan-artifacts/sbom-scan-results-*; do
            [ -f "$d/tmas_scan_report.json" ] && SBOM_JSON="$d/tmas_scan_report.json" && break
          done
          [ -z "$SBOM_JSON" ] && [ -f scan-artifacts/sbom-scan-results/tmas_scan_report.json ] && SBOM_JSON="scan-artifacts/sbom-scan-results/tmas_scan_report.json"
          if [ -n "$SBOM_JSON" ]; then append_sbom_details "$SBOM_JSON"; else echo "⚠️ No SBOM scan data (job failed or no artifact)." >> "$SUM"; echo "" >> "$SUM"; fi

          echo "📥 **Artifacts:** \`vulnerability-scan-results\`, \`malware-scan-results\`, \`secrets-scan-results\`, \`sbom-scan-results\` (full JSON + Markdown)." >> "$SUM"
