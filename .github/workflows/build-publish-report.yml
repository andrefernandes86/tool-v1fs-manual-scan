# Multi-job workflow: build → push-to-dockerhub → (vulnerabilities-scan, secrets-scan, sbom-scan) → report
# Produces the native GitHub Actions flowchart view. No AWS, no deploy.

name: Build, Scan & Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: v1fs-scanner

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image
        run: docker save ${{ env.IMAGE_NAME }}:latest -o image.tar
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  push-to-dockerhub:
    name: push-to-dockerhub
    needs: build
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.outputs.outputs.repo }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      - name: Log in to Docker Hub
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push
        id: push
        if: vars.PUBLISH_TO_DOCKERHUB == 'true'
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$REPO:latest"
          docker push "$REPO:latest" || true
          echo "repo=$REPO" >> $GITHUB_OUTPUT
      - name: Set job output
        id: outputs
        if: always()
        run: echo "repo=${{ steps.push.outputs.repo }}" >> $GITHUB_OUTPUT

  vulnerabilities-scan:
    name: vulnerabilities-scan
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS vulnerability scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "true"
          malwareScan: "false"
          secretsScan: "false"
          additionalArgs: ""
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  secrets-scan:
    name: secrets-scan
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS secrets scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "false"
          malwareScan: "false"
          secretsScan: "true"
          additionalArgs: ""
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  sbom-scan:
    name: sbom-scan
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TMAS SBOM scan
        uses: trendmicro/tmas-scan-action@v3.1.1
        with:
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifact: "dir:."
          vulnerabilitiesScan: "true"
          malwareScan: "false"
          secretsScan: "false"
          additionalArgs: "--saveSBOM"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-scan-results
          path: |
            scan-report.md
            tmas_scan_report.json
          if-no-files-found: ignore

  report:
    name: report
    needs: [build, push-to-dockerhub, vulnerabilities-scan, secrets-scan, sbom-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          PUSH_RESULT="${{ needs.push-to-dockerhub.result }}"
          VULN_RESULT="${{ needs.vulnerabilities-scan.result }}"
          SECRETS_RESULT="${{ needs.secrets-scan.result }}"
          SBOM_RESULT="${{ needs.sbom-scan.result }}"
          PUSH_REPO="${{ needs.push-to-dockerhub.outputs.repo }}"

          status_icon() {
            case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚠️";; esac
          }

          {
            echo "# 📋 Pipeline Report"
            echo ""
            echo "**build-publish-report.yml** · \`on: push\` / \`workflow_dispatch\`"
            echo ""
            echo "## Flow"
            echo ""
            echo "| build | push-to-dockerhub | vulnerabilities-scan | secrets-scan | sbom-scan | report |"
            echo "| $(status_icon "$BUILD_RESULT") | $(status_icon "$PUSH_RESULT") | $(status_icon "$VULN_RESULT") | $(status_icon "$SECRETS_RESULT") | $(status_icon "$SBOM_RESULT") | ✅ |"
            echo ""
            echo "---"
            echo "## 📦 Docker Hub"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ -n "$PUSH_REPO" ] && [ "$PUSH_RESULT" = "success" ]; then
            {
              echo "✅ **Image published** · [\`$PUSH_REPO\`](https://hub.docker.com/r/$PUSH_REPO/tags)"
              echo ""
              echo "\`docker pull $PUSH_REPO:latest\`"
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "⏭️ **Not published** · Set variable \`PUBLISH_TO_DOCKERHUB=true\` and secrets \`DOCKERHUB_USERNAME\`, \`DOCKERHUB_TOKEN\`."
              echo ""
            } >> $GITHUB_STEP_SUMMARY
          fi

          {
            echo "---"
            echo "## 🔒 Trend Vision One (TMAS)"
            echo ""
            echo "| Scan | Status |"
            echo "|------|--------|"
            echo "| Vulnerabilities | $(status_icon "$VULN_RESULT") |"
            echo "| Secrets | $(status_icon "$SECRETS_RESULT") |"
            echo "| SBOM | $(status_icon "$SBOM_RESULT") |"
            echo ""
            echo "Download artifacts **vulnerability-scan-results**, **secrets-scan-results**, **sbom-scan-results** for full reports."
            echo ""
            echo "---"
          } >> $GITHUB_STEP_SUMMARY
